[package]
name = "octree_pathtracing"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10.0"
mc_utils = { path = "../mc_utils" }
glam = { version = "0.32.1", features = ["bytemuck"] }
bitflags = "2.9.1"
num-traits = "0.2.19"
dashmap = "6.1.0"
fxhash = "0.2.1"
rand = "0.10.0"
lazy_static = "1.5.0"
hashbrown = "0.16.1"
eframe = { version = "0.33.3", features = ["default", "wgpu"] }
egui_extras = { version = "0.33.3", features = ["default", "image"] }
env_logger = "0.11.8"
lasso = "0.7.3"
bytemuck = "1.23.0"
pollster = "0.4.0"
log = "0.4.28"
egui-wgpu = "0.33.3"
rand_distr = "0.6.0"
parking_lot = "0.12.4"
rfd = "0.17.2"
tracing = "0.1.41"
thiserror = "2.0.17"
image = "0.25.10"


[profile.release-with-debug]
inherits = "release"

[profile.release]
debug = true
